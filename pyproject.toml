[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xuipy"
version = "0.1.0"
description = "A Python client for the 3x-ui panel API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahdyar Shiri", email = "dev.mahdyar@gmail.com" }]
keywords = ["xui", "3x-ui", "sanaei", "vpn", "vless", "vmess", "xray", "panel", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests-mock>=1.11",
]

[project.urls]
Homepage = "https://github.com/mahdyarshiri/xuipy"
Repository = "https://github.com/mahdyarshiri/xuipy"
Issues = "https://github.com/mahdyarshiri/xuipy/issues"

[tool.setuptools.packages.find]
include = ["xuipy*"]